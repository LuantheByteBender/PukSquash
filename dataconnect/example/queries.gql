# ------------------------------------------------------------
# CoachAvailability queries
# ------------------------------------------------------------

# Coaches available for a specific date + time-slot.
query GetAvailableCoaches($availabilityDate: Date!, $timeSlotId: UUID!)
@auth(level: NO_ACCESS) {
  coachAvailabilities(where: { availabilityDate: { eq: $availabilityDate }, timeSlotId: { eq: $timeSlotId } }) {
    availabilityDate
    createdAt
    coachId
    timeSlotId
    coach { id fullName email }
    timeSlot { id startTime endTime }
  }
}

query IsCoachAvailable($availabilityDate: Date!, $timeSlotId: UUID!, $coachId: UUID!)
@auth(level: NO_ACCESS) {
  coachAvailabilities(
    where: {
      availabilityDate: { eq: $availabilityDate }
      timeSlotId: { eq: $timeSlotId }
      coachId: { eq: $coachId }
    }
    limit: 1
  ) {
    coachId
  }
}
query ListAllUsers
@auth(level: NO_ACCESS) {
  users {
    id
    firebaseUid
    studentNumber
    fullName
    email
    role
    status
    createdAt
    updatedAt
  }
}

query ListAllCourts
@auth(level: NO_ACCESS) {
  courts {
    id
    name
    description
    status
    createdAt
    updatedAt
  }
}

# Published availability for one Coach on a selected date.
query GetCoachAvailabilityForDate(
  $coachId: UUID!
  $availabilityDate: Date!
)
@auth(level: NO_ACCESS) {
  coachAvailabilities(
    where: {
      coachId: { eq: $coachId }
      availabilityDate: { eq: $availabilityDate }
    }
  ) {
    availabilityDate
    createdAt
    coachId
    timeSlotId
    coach { id fullName }
    timeSlot { id startTime endTime }
  }
}

# Check whether a confirmed booking uses this Coach's date and time slot.
query GetConfirmedBookingForCoachSlot(
  $coachId: UUID!
  $bookingDate: Date!
  $timeSlotId: UUID!
)
@auth(level: NO_ACCESS) {
  bookings(
    where: {
      coachId: { eq: $coachId }
      bookingDate: { eq: $bookingDate }
      timeSlotId: { eq: $timeSlotId }
      status: { eq: "CONFIRMED" }
    }
    limit: 1
  ) {
    id
  }
}

# Confirmed private-coaching bookings assigned to one Coach.
query GetConfirmedBookingsByCoach($coachId: UUID!)
@auth(level: NO_ACCESS) {
  bookings(
    where: {
      coachId: { eq: $coachId }
      bookingType: { eq: "PRIVATE_COACH" }
      status: { eq: "CONFIRMED" }
    }
  ) {
    id
    bookingDate
    bookingType
    status
    bookedAt
    cancelledAt
    createdAt

    court { id name }
    timeSlot { id startTime endTime }
    createdBy { id fullName }
  }
}