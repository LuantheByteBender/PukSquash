# ============================================================
# PukSquash — Phase 1 Database Schema
# ============================================================
# Source of truth for the Firebase SQL Connect / PostgreSQL
# tables. Laravel does NOT manage these tables via migrations
# or Eloquent — it talks to them through the SQL Connect
# GraphQL connector exclusively.
# ============================================================


# ------------------------------------------------------------
# User
# ------------------------------------------------------------
# Application profile for an authenticated Firebase user.
# Firebase Authentication remains responsible for identity;
# this table stores the PukSquash role and status.
#
# Allowed role values:  USER | COACH | ADMIN
# Allowed status values: ACTIVE | INACTIVE | SUSPENDED
# ------------------------------------------------------------

type User @table {
  # UUID primary key, auto-generated by SQL Connect.
  # id: UUID! @default(expr: "uuidV4()")

  # Firebase Authentication UID — unique, never null.
  firebaseUid: String! @unique

  # University student number (nullable — coaches/admins may not have one).
  studentNumber: String @unique

  # Full display name.
  fullName: String!

  # Email address.
  email: String! @unique

  # USER | COACH | ADMIN
  role: String! @default(value: "USER")

  # ACTIVE | INACTIVE | SUSPENDED
  status: String! @default(value: "ACTIVE")

  fundsBalanceCents: Int! @default(value: 0)

  privateCoachingFeeCents: Int! @default(value: 0)

  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}


# ------------------------------------------------------------
# Court
# ------------------------------------------------------------
# A physical squash court that can be booked.
#
# Allowed status values: ACTIVE | INACTIVE
# ------------------------------------------------------------

type Court @table {
  # id: UUID! @default(expr: "uuidV4()")

  name: String! @unique

  description: String

  # ACTIVE | INACTIVE
  status: String! @default(value: "ACTIVE")

  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}


# ------------------------------------------------------------
# TimeSlot
# ------------------------------------------------------------
# Fixed one-hour slots the system offers for booking.
# ------------------------------------------------------------

type TimeSlot @table {
  # id: UUID! @default(expr: "uuidV4()")

  startTime: String!
  endTime: String!

  displayOrder: Int!

  isActive: Boolean! @default(value: true)
}


# ------------------------------------------------------------
# Booking
# ------------------------------------------------------------
# A reservation of a court + time-slot on a specific date.
#
# Allowed booking_type values: OPEN | LOCKED | PRIVATE_COACH
# Allowed status values: CONFIRMED | CANCELLED
#
# Business rules enforced by Laravel:
#   - Only one CONFIRMED booking per court + date + time_slot.
#   - CANCELLED bookings must not permanently block the cell.
#   - OPEN: Player 1 creates, Player 2 joins.
#   - LOCKED: cannot be joined.
#   - PRIVATE_COACH: has coach_id and is locked.
# ------------------------------------------------------------

type Booking @table {
  # id: UUID! @default(expr: "uuidV4()")

  # FK → Court
  court: Court!

  # FK → TimeSlot
  timeSlot: TimeSlot!

  # FK → User (the student who created this booking)
  createdBy: User!

  # FK → User (optional coach)
  coach: User

  bookingDate: Date!

  # OPEN | LOCKED | PRIVATE_COACH
  bookingType: String!

  # CONFIRMED | CANCELLED
  status: String! @default(value: "CONFIRMED")

  bookedAt: Timestamp! @default(expr: "request.time")
  cancelledAt: Timestamp

  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}


# ------------------------------------------------------------
# BookingPlayer
# ------------------------------------------------------------
# Join table: which users sit in Player 1 / Player 2 position
# for a given booking.
#
# Constraints (enforced by Laravel + DB):
#   UNIQUE(booking_id, player_position)
#   UNIQUE(booking_id, user_id)
# ------------------------------------------------------------

type BookingPlayer @table {
  # id: UUID! @default(expr: "uuidV4()")

  # FK → Booking
  booking: Booking!

  # FK → User
  user: User!

  # 1 or 2
  playerPosition: Int!

  joinedAt: Timestamp! @default(expr: "request.time")
}


# ------------------------------------------------------------
# CoachAvailability
# ------------------------------------------------------------
# A coach publishes availability for a specific date + slot.
#
# Constraint (enforced by Laravel + DB):
#   UNIQUE(coach_id, availability_date, time_slot_id)
# ------------------------------------------------------------

type CoachAvailability @table(key: ["coach", "timeSlot", "availabilityDate"]) {
  # id: UUID! @default(expr: "uuidV4()")

  # FK → User (must have role = COACH)
  coach: User!

  # FK → TimeSlot
  timeSlot: TimeSlot!

  availabilityDate: Date!

  createdAt: Timestamp! @default(expr: "request.time")
}