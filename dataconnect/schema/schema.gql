# ============================================================
# PukSquash - Phase 1 Database Schema
# ============================================================


# ------------------------------------------------------------
# User
# ------------------------------------------------------------

type User @table(name: "users") {

  id: UUID! @default(expr: "uuidV4()")

  # Firebase Authentication UID.
  firebaseUid: String! @unique

  # Nullable because not every possible account must
  # necessarily have a student number.
  studentNumber: String @unique

  fullName: String!

  email: String! @unique

  # Allowed by Laravel:
  # USER
  # COACH
  # ADMIN
  role: String! @default(value: "USER")

  # Allowed by Laravel:
  # ACTIVE
  # INACTIVE
  # SUSPENDED
  status: String! @default(value: "ACTIVE")

  createdAt: Timestamp! @default(expr: "request.time")

  updatedAt: Timestamp! @default(expr: "request.time")
}


# ------------------------------------------------------------
# Court
# ------------------------------------------------------------

type Court @table(name: "courts") {

  id: UUID! @default(expr: "uuidV4()")

  name: String! @unique

  description: String

  # ACTIVE
  # INACTIVE
  status: String! @default(value: "ACTIVE")

  createdAt: Timestamp! @default(expr: "request.time")

  updatedAt: Timestamp! @default(expr: "request.time")
}


# ------------------------------------------------------------
# Time Slot
# ------------------------------------------------------------

type TimeSlot @table(name: "time_slots") {

  id: UUID! @default(expr: "uuidV4()")

  # Fixed one-hour slot.
  # Stored as HH:MM, e.g. "08:00".
  startTime: String! @col(dataType: "varchar(5)")

  endTime: String! @col(dataType: "varchar(5)")

  displayOrder: Int!

  isActive: Boolean! @default(value: true)
}


# ------------------------------------------------------------
# Booking
# ------------------------------------------------------------

type Booking @table(name: "bookings") {

  id: UUID! @default(expr: "uuidV4()")

  court: Court!

  timeSlot: TimeSlot!

  createdByUser: User!

  # Only populated for PRIVATE_COACH bookings.
  coach: User

  bookingDate: Date!

  # OPEN
  # LOCKED
  # PRIVATE_COACH
  bookingType: String!

  # CONFIRMED
  # CANCELLED
  status: String! @default(value: "CONFIRMED")

  bookedAt: Timestamp! @default(expr: "request.time")

  cancelledAt: Timestamp

  createdAt: Timestamp! @default(expr: "request.time")

  updatedAt: Timestamp! @default(expr: "request.time")
}


# ------------------------------------------------------------
# Booking Player
# ------------------------------------------------------------

type BookingPlayer
  @table(name: "booking_players")
  @unique(fields: ["booking", "user"])
  @unique(fields: ["booking", "playerPosition"]) {

  id: UUID! @default(expr: "uuidV4()")

  booking: Booking!

  user: User!

  # 1 or 2
  playerPosition: Int!

  joinedAt: Timestamp! @default(expr: "request.time")
}


# ------------------------------------------------------------
# Coach Availability
# ------------------------------------------------------------

type CoachAvailability
  @table(name: "coach_availability")
  @unique(fields: ["coach", "timeSlot", "availabilityDate"]) {

  id: UUID! @default(expr: "uuidV4()")

  coach: User!

  timeSlot: TimeSlot!

  availabilityDate: Date!

  createdAt: Timestamp! @default(expr: "request.time")
}